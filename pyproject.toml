[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
